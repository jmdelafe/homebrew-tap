name: Update casks

on:
  schedule:
    - cron: '17 */6 * * *'
  repository_dispatch:
    types: [jot-release]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-casks
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - cask: jot
            # VERSION is substituted from the livecheck result.
            url: https://github.com/jmdelafe/jot/releases/download/vVERSION/Jot-macos-arm64.zip
            release: https://github.com/jmdelafe/jot/releases/tag/vVERSION
            audit_except: --except=github_prerelease_version,token_conflicts
          - cask: alacritty
            url: https://github.com/alacritty/alacritty/releases/download/vVERSION/Alacritty-vVERSION.dmg
            release: https://github.com/alacritty/alacritty/releases/tag/vVERSION
            audit_except: ''
    steps:
      - uses: actions/checkout@v5

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          # setup-homebrew replaces the checkout's .git, dropping the credentials
          # actions/checkout stored there. Its token stays configured for the
          # rest of the job, which the update branch push needs.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Tap local repo
        run: |
          tap_dir="$(brew --repository)/Library/Taps/jmdelafe/homebrew-tap"
          mkdir -p "$(dirname "$tap_dir")"
          rm -rf "$tap_dir"
          ln -sf "$GITHUB_WORKSPACE" "$tap_dir"
          brew trust jmdelafe/tap

      - name: Check for a new version
        id: check
        env:
          CASK: ${{ matrix.cask }}
        run: |
          json=$(brew livecheck --cask --json "jmdelafe/tap/${CASK}")
          current=$(jq -r '.[0].version.current' <<<"$json")
          latest=$(jq -r '.[0].version.latest' <<<"$json")
          echo "current=$current latest=$latest"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Open update pull request
        if: steps.check.outputs.latest != steps.check.outputs.current && steps.check.outputs.latest != 'null'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.check.outputs.latest }}
          CASK: ${{ matrix.cask }}
          URL_TEMPLATE: ${{ matrix.url }}
          RELEASE_TEMPLATE: ${{ matrix.release }}
          AUDIT_EXCEPT: ${{ matrix.audit_except }}
        run: |
          branch="update/${CASK}-${VERSION}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "Branch $branch already exists."
            exit 0
          fi
          url="${URL_TEMPLATE//VERSION/$VERSION}"
          release="${RELEASE_TEMPLATE//VERSION/$VERSION}"
          sha=$(curl -fsSL "$url" | shasum -a 256 | cut -d' ' -f1)
          sed -i '' -E \
            -e "s/^  version \".*\"/  version \"${VERSION}\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"${sha}\"/" \
            "Casks/${CASK}.rb"
          brew style jmdelafe/tap
          brew audit --cask --online $AUDIT_EXCEPT "jmdelafe/tap/${CASK}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "${CASK} ${VERSION}"
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --base main --head "$branch" \
            --title "${CASK} ${VERSION}" \
            --body "Automated update of the ${CASK} cask to [v${VERSION}](${release})."
